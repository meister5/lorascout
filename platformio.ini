; lorascout -- M5Stack Cardputer ADV + Cap LoRa-1262
;
; There is exactly one firmware environment, and it is the ADV. The Cap-Bus
; header the LoRa-1262 plugs into does not exist on the original Cardputer
; v1.1, and its pin map, keyboard and I2C layout differ throughout, so a
; "cardputer" build would be a binary that cannot work.

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@^6.9.0
; A generic S3 target with the ADV's memory configuration spelled out, rather
; than a board alias, so the build does not depend on which board definitions a
; given platform release happens to ship.
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.5
    m5stack/M5Cardputer@^1.0.3
    jgromes/RadioLib@^7.1.0

; Host-side tests for lib/core. No hardware, no Arduino headers, no toolchain
; beyond a C++17 compiler -- `make test` runs exactly the same sources.
[env:native]
platform = native
test_framework = custom
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Ilib/core
build_src_filter = -<*>
