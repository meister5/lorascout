name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: core tests (host compiler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lib/core pulls in no Arduino or hardware headers, so the whole tested
      # surface builds with nothing but a C++17 compiler. -Werror is on.
      - name: Run test suites
        run: make test

  pio-tests:
    name: core tests (platformio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Run the same suites through pio
        run: pio test -e native

  firmware:
    name: firmware (cardputer-adv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          # The ESP32-S3 toolchain is a large download; without this the job
          # spends most of its time fetching a compiler it already had.
          path: ~/.platformio
          key: pio-esp32s3-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      # package.sh runs the same `pio run`, then gates the app image on the
      # 0xE9 magic and the OTA slot size M5Launcher installs into, and emits
      # the app/merged pair.
      - name: Build release binaries
        run: tools/package.sh
      - name: Report image sizes
        run: ls -l dist/
      # Keep this artifact to the bins alone. upload-artifact roots the archive
      # at the common ancestor of its paths, so adding .pio/ here would push the
      # bins down to dist/dist/*.bin once downloaded, and the release glob below
      # would silently match nothing.
      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: lorascout-firmware
          path: dist/*.bin
          if-no-files-found: error
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: lorascout-debug
          path: .pio/build/cardputer-adv/firmware.elf
          if-no-files-found: error

  release:
    name: publish release
    needs: [core-tests, pio-tests, firmware]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lorascout-firmware
          path: dist
      # The .elf is a separate artifact; a release asset should only be
      # something you can actually flash. fail_on_unmatched_files turns a glob
      # that matches nothing into a red build rather than an empty release.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          fail_on_unmatched_files: true
          generate_release_notes: true
